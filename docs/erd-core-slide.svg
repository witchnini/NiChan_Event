<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#111827" flood-opacity=".16"/>
    </filter>
    <style>
      .title{font:700 25px Arial,sans-serif;fill:#171717}
      .subtitle{font:400 12px Arial,sans-serif;fill:#667085}
      .entity{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .entity-core{fill:#fff;stroke:#c62828;stroke-width:2}
      .head{fill:#c62828}
      .head-dark{fill:#9f1d20}
      .ename{font:700 11px Arial,sans-serif;fill:#fff}
      .field{font:400 8.5px Consolas,monospace;fill:#344054}
      .pk{font-weight:700;fill:#9f1d20}
      .fk{font-weight:700;fill:#175cd3}
      .rel{fill:none;stroke:#667085;stroke-width:1.35}
      .card{font:700 8px Arial,sans-serif;fill:#475467}
      .note{font:400 9px Arial,sans-serif;fill:#667085}
    </style>
  </defs>

  <image href="slide-template-ojt.png" x="0" y="0" width="960" height="540"/>

  <text x="66" y="58" class="title">MÔ HÌNH THỰC THỂ KẾT HỢP (ERD)</text>
  <text x="67" y="78" class="subtitle">Các bảng dữ liệu trọng tâm xoay quanh vòng đời tổ chức sự kiện</text>

  <!-- Relationships: drawn first so they stay behind entities -->
  <path d="M190 186H390" class="rel"/>
  <text x="196" y="181" class="card">1</text><text x="380" y="181" class="card">N</text>

  <path d="M190 350H230" class="rel"/>
  <text x="196" y="345" class="card">1</text><text x="220" y="345" class="card">N</text>
  <path d="M350 350C378 350 368 283 390 283" class="rel"/>
  <text x="354" y="345" class="card">N</text><text x="380" y="278" class="card">1</text>

  <path d="M510 238C545 238 555 172 600 172" class="rel"/>
  <text x="516" y="232" class="card">1</text><text x="590" y="167" class="card">N</text>
  <path d="M720 172C755 172 747 277 770 277" class="rel"/>
  <text x="726" y="167" class="card">1</text><text x="760" y="272" class="card">N</text>

  <path d="M510 270H600" class="rel"/>
  <text x="516" y="265" class="card">1</text><text x="590" y="265" class="card">N</text>
  <path d="M720 277H770" class="rel"/>
  <text x="726" y="272" class="card">1</text><text x="760" y="272" class="card">N</text>

  <path d="M450 310V357" class="rel"/>
  <text x="456" y="320" class="card">1</text><text x="456" y="352" class="card">N</text>
  <path d="M510 399H600" class="rel"/>
  <text x="516" y="394" class="card">1</text><text x="590" y="394" class="card">N</text>
  <path d="M600 420C545 420 535 448 130 448V392" class="rel"/>
  <text x="590" y="415" class="card">N</text><text x="136" y="405" class="card">1</text>

  <!-- USER -->
  <g filter="url(#shadow)">
    <rect x="70" y="140" width="120" height="92" rx="5" class="entity"/>
    <path d="M75 140h110a5 5 0 0 1 5 5v20H70v-20a5 5 0 0 1 5-5z" class="head"/>
  </g>
  <text x="130" y="157" text-anchor="middle" class="ename">USER</text>
  <text x="79" y="179" class="field pk">PK  id</text>
  <text x="79" y="193" class="field">email</text>
  <text x="79" y="207" class="field">role</text>
  <text x="79" y="221" class="field">displayName</text>

  <!-- VENDOR -->
  <g filter="url(#shadow)">
    <rect x="70" y="306" width="120" height="86" rx="5" class="entity"/>
    <path d="M75 306h110a5 5 0 0 1 5 5v20H70v-20a5 5 0 0 1 5-5z" class="head"/>
  </g>
  <text x="130" y="323" text-anchor="middle" class="ename">VENDOR</text>
  <text x="79" y="345" class="field pk">PK  id</text>
  <text x="79" y="359" class="field fk">FK  categoryId</text>
  <text x="79" y="373" class="field">name</text>
  <text x="79" y="387" class="field">status</text>

  <!-- EVENT VENDOR -->
  <g filter="url(#shadow)">
    <rect x="230" y="306" width="120" height="86" rx="5" class="entity"/>
    <path d="M235 306h110a5 5 0 0 1 5 5v20H230v-20a5 5 0 0 1 5-5z" class="head-dark"/>
  </g>
  <text x="290" y="323" text-anchor="middle" class="ename">EVENT_VENDOR</text>
  <text x="239" y="345" class="field pk">PK  id</text>
  <text x="239" y="359" class="field fk">FK  eventId</text>
  <text x="239" y="373" class="field fk">FK  vendorId</text>
  <text x="239" y="387" class="field">contractValue</text>

  <!-- EVENT: central entity -->
  <g filter="url(#shadow)">
    <rect x="390" y="205" width="120" height="105" rx="5" class="entity-core"/>
    <path d="M395 205h110a5 5 0 0 1 5 5v22H390v-22a5 5 0 0 1 5-5z" class="head-dark"/>
  </g>
  <text x="450" y="223" text-anchor="middle" class="ename">EVENT</text>
  <text x="399" y="247" class="field pk">PK  id</text>
  <text x="399" y="261" class="field fk">FK  customerUserId</text>
  <text x="399" y="275" class="field fk">FK  organizerUserId</text>
  <text x="399" y="289" class="field">name · status</text>
  <text x="399" y="303" class="field">eventDate · budget</text>

  <!-- CONTRACT -->
  <g filter="url(#shadow)">
    <rect x="600" y="128" width="120" height="88" rx="5" class="entity"/>
    <path d="M605 128h110a5 5 0 0 1 5 5v20H600v-20a5 5 0 0 1 5-5z" class="head"/>
  </g>
  <text x="660" y="145" text-anchor="middle" class="ename">CONTRACT</text>
  <text x="609" y="167" class="field pk">PK  id</text>
  <text x="609" y="181" class="field fk">FK  eventId</text>
  <text x="609" y="195" class="field fk">FK  customerUserId</text>
  <text x="609" y="209" class="field">status · totalValue</text>

  <!-- PAYMENT ORDER -->
  <g filter="url(#shadow)">
    <rect x="600" y="234" width="120" height="88" rx="5" class="entity"/>
    <path d="M605 234h110a5 5 0 0 1 5 5v20H600v-20a5 5 0 0 1 5-5z" class="head"/>
  </g>
  <text x="660" y="251" text-anchor="middle" class="ename">PAYMENT_ORDER</text>
  <text x="609" y="273" class="field pk">PK  id</text>
  <text x="609" y="287" class="field fk">FK  eventId</text>
  <text x="609" y="301" class="field fk">FK  contractId</text>
  <text x="609" y="315" class="field">amount · status</text>

  <!-- TRANSACTION -->
  <g filter="url(#shadow)">
    <rect x="770" y="234" width="120" height="88" rx="5" class="entity"/>
    <path d="M775 234h110a5 5 0 0 1 5 5v20H770v-20a5 5 0 0 1 5-5z" class="head"/>
  </g>
  <text x="830" y="251" text-anchor="middle" class="ename">TRANSACTION</text>
  <text x="779" y="273" class="field pk">PK  id</text>
  <text x="779" y="287" class="field fk">FK  paymentOrderId</text>
  <text x="779" y="301" class="field">amount · gateway</text>
  <text x="779" y="315" class="field">status · sepayTransId</text>

  <!-- PROJECT BUDGET -->
  <g filter="url(#shadow)">
    <rect x="390" y="357" width="120" height="86" rx="5" class="entity"/>
    <path d="M395 357h110a5 5 0 0 1 5 5v20H390v-20a5 5 0 0 1 5-5z" class="head"/>
  </g>
  <text x="450" y="374" text-anchor="middle" class="ename">PROJECT_BUDGET</text>
  <text x="399" y="396" class="field pk">PK  id</text>
  <text x="399" y="410" class="field fk">FK  eventId</text>
  <text x="399" y="424" class="field">name</text>
  <text x="399" y="438" class="field">currencyCode</text>

  <!-- BUDGET ITEM -->
  <g filter="url(#shadow)">
    <rect x="600" y="357" width="120" height="86" rx="5" class="entity"/>
    <path d="M605 357h110a5 5 0 0 1 5 5v20H600v-20a5 5 0 0 1 5-5z" class="head"/>
  </g>
  <text x="660" y="374" text-anchor="middle" class="ename">BUDGET_ITEM</text>
  <text x="609" y="396" class="field pk">PK  id</text>
  <text x="609" y="410" class="field fk">FK  projectBudgetId</text>
  <text x="609" y="424" class="field fk">FK  vendorId</text>
  <text x="609" y="438" class="field">estimated · actual</text>

  <!-- Legend -->
  <text x="745" y="399" class="note"><tspan class="pk">PK</tspan> Khóa chính</text>
  <text x="745" y="416" class="note"><tspan class="fk">FK</tspan> Khóa ngoại</text>
  <text x="745" y="433" class="note">1 — N  Quan hệ một–nhiều</text>
</svg>
